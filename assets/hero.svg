<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Bookstore Discovery</title><desc id="desc">Banner escuro com livros flutuantes e elementos de pesquisa em movimento.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b2c"/><stop offset="1" stop-color="#123f3c"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#89b8ac" stroke-opacity=".12"/></pattern>
    <style>
      .label{font:700 12px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#9fe4c8}.big{font:800 62px 'Segoe UI',Arial,sans-serif;letter-spacing:-4px;fill:#f4f8f4}.sub{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#b8d6cc}.small{font:700 11px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#173233}.book1{animation:float1 5s ease-in-out infinite}.book2{animation:float2 6s ease-in-out infinite}.book3{animation:float3 5.5s ease-in-out infinite}.line{stroke-dasharray:9 9;animation:flow 7s linear infinite}.pulse{animation:pulse 2.5s ease-in-out infinite}@keyframes float1{50%{transform:translateY(-8px)}}@keyframes float2{50%{transform:translateY(10px)}}@keyframes float3{50%{transform:translateY(-6px)}}@keyframes flow{to{stroke-dashoffset:-108}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="270" rx="20" fill="url(#bg)"/><rect width="1200" height="270" rx="20" fill="url(#grid)"/>
  <circle cx="1120" cy="65" r="210" fill="#79c7a5" opacity=".07"/><path class="line" d="M636 136H745" stroke="#95ddba" stroke-width="2" fill="none"/>
  <circle class="pulse" cx="745" cy="136" r="6" fill="#9fe4c8"/>
  <text x="68" y="68" class="label">CATÁLOGO ABERTO / EXPERIÊNCIA DE DESCOBERTA</text>
  <text x="68" y="143" class="big">BOOKSTORE</text><text x="68" y="202" class="big" fill="#a9e1cd">DISCOVERY<tspan fill="#ff916c">.</tspan></text>
  <g class="book1"><rect x="800" y="55" width="85" height="158" rx="4" fill="#e7d7b9"/><rect x="800" y="55" width="9" height="158" fill="#bca98b"/><text x="818" y="106" class="small">IDEIAS</text><text x="818" y="127" class="small">QUE</text><text x="818" y="148" class="small">MOVEM</text></g>
  <g class="book2"><rect x="892" y="35" width="102" height="190" rx="4" fill="#a9e1cd"/><rect x="892" y="35" width="10" height="190" fill="#74ae9c"/><text x="911" y="89" class="small">OUTROS</text><text x="911" y="110" class="small">MUNDOS</text></g>
  <g class="book3"><rect x="1002" y="69" width="100" height="145" rx="4" fill="#ff916c"/><rect x="1002" y="69" width="10" height="145" fill="#d66b50"/><text x="1022" y="125" class="small">NOVAS</text><text x="1022" y="146" class="small">PERGUNTAS</text></g>
  <text x="68" y="241" class="sub">Pesquisa, leitura e dados de uma fonte aberta.</text>
</svg>
